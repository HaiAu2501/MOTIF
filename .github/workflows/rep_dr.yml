name: rep_dr

# Reproduce the Deconstruction-Repair results: train all three strategies (F1+F2+F3)
# for each problem, then test in parallel across instance sizes, reporting objective
# and improvement over the seed baseline.
#
# Only the three-function setting is used (cfg/solver/*_dr_f1_f2_f3.yaml); the
# one- and two-function ablation configs in cfg/solver/ are deliberately not run here.
#
# Sizes follow each problem's own test datasets. TSP-DR and CVRP-DR ship 50/100/200.
# BPP-DR ships 100/200/300 only - there is no BPP50 dataset, so it runs 100/200 and no
# dataset is generated here, to keep the protocol identical to the paper.

on:
  workflow_dispatch:
    inputs:
      problems:
        description: "Problems to run (space separated)"
        default: "tsp_dr cvrp_dr bpp_dr"
      outer_iterations:
        description: "MCTS outer iterations (tree selection)"
        default: "20"
      inner_iterations:
        description: "Competitive turns per selected tree"
        default: "10"
      final_iterations:
        description: "Final Round turns per strategy"
        default: "10"
      model:
        description: "LLM model"
        default: "gpt-4o-mini"
      temperature:
        description: "LLM temperature"
        default: "1.0"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  plan:
    name: plan matrix
    runs-on: ubuntu-latest
    outputs:
      train: ${{ steps.build.outputs.train }}
      test: ${{ steps.build.outputs.test }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        name: Build train and test matrices
        env:
          PROBLEMS: ${{ inputs.problems }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          # size list per problem == the test datasets that problem actually ships
          SIZES = {
              "tsp_dr":  [50, 100, 200],
              "cvrp_dr": [50, 100, 200],
              "bpp_dr":  [100, 200],
          }
          # always the three-function setting
          SOLVER = {p: f"{p}_f1_f2_f3" for p in SIZES}

          wanted = os.environ["PROBLEMS"].split()
          unknown = [p for p in wanted if p not in SIZES]
          if unknown:
              raise SystemExit(f"unknown problems: {unknown}")

          train = [{"problem": p, "solver": SOLVER[p]} for p in wanted]
          test = [{"problem": p, "size": s} for p in wanted for s in SIZES[p]]
          print("train=" + json.dumps({"include": train}))
          print("test=" + json.dumps({"include": test}))
          PY

  train:
    name: train ${{ matrix.problem }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.train) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MOTIF (${{ matrix.solver }})
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py \
            solver=${{ matrix.solver }} \
            mcts.outer_iterations=${{ inputs.outer_iterations }} \
            mcts.inner_iterations=${{ inputs.inner_iterations }} \
            mcts.final_iterations=${{ inputs.final_iterations }} \
            llm.model=${{ inputs.model }} \
            llm.temperature=${{ inputs.temperature }} \
            paths.results_dir="$GITHUB_WORKSPACE/results"

      - name: Check all three heuristics were produced
        run: |
          for f in F1 F2 F3; do
            test -f "results/${f}_final_best.py" || {
              echo "::error::results/${f}_final_best.py missing"
              exit 1
            }
            echo "--- results/${f}_final_best.py ---"
            cat "results/${f}_final_best.py"
          done

      - name: Upload heuristics
        uses: actions/upload-artifact@v4
        with:
          name: rep_dr-heuristic-${{ matrix.problem }}
          path: results/F*_final_best.py
          if-no-files-found: error

      - name: Upload search logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rep_dr-logs-${{ matrix.problem }}
          path: results/*.json
          if-no-files-found: warn

  test:
    name: test ${{ matrix.problem }} @ ${{ matrix.size }}
    needs: [plan, train]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.test) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Baseline first, while problems/ still holds the seed implementations.
      - name: Evaluate seed baseline
        run: |
          python .github/scripts/rep_eval.py \
            --problem ${{ matrix.problem }} \
            --size ${{ matrix.size }} \
            --label baseline \
            --out results/${{ matrix.problem }}_${{ matrix.size }}_baseline.json

      - name: Download heuristics
        uses: actions/download-artifact@v4
        with:
          name: rep_dr-heuristic-${{ matrix.problem }}
          path: heuristic

      - name: Install heuristics into problems/${{ matrix.problem }}
        run: |
          for f in heuristic/F*_final_best.py; do
            target="problems/${{ matrix.problem }}/$(basename "$f" | cut -d_ -f1).py"
            cp "$f" "$target"
            echo "--- $target ---"
            cat "$target"
          done

      - name: Evaluate MOTIF heuristics
        run: |
          python .github/scripts/rep_eval.py \
            --problem ${{ matrix.problem }} \
            --size ${{ matrix.size }} \
            --label motif \
            --out results/${{ matrix.problem }}_${{ matrix.size }}_motif.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rep_dr-result-${{ matrix.problem }}-${{ matrix.size }}
          path: results/${{ matrix.problem }}_${{ matrix.size }}_*.json
          if-no-files-found: error

  report:
    name: report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job writes, and only to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Collect results
        uses: actions/download-artifact@v4
        with:
          pattern: rep_dr-result-*
          path: publish/results

      - name: Collect heuristics
        uses: actions/download-artifact@v4
        with:
          pattern: rep_dr-heuristic-*
          path: publish/heuristics

      - name: Collect search logs
        uses: actions/download-artifact@v4
        with:
          pattern: rep_dr-logs-*
          path: publish/logs
        continue-on-error: true

      - name: Build report
        run: |
          python .github/scripts/rep_report.py \
            --mode improvement \
            --glob "publish/results/**/*.json" \
            --heuristics publish/heuristics \
            --title "_rep_dr · run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · commit \`${{ github.sha }}\`_" \
            --out publish/report.md

      - name: Bundle logs
        run: |
          mkdir -p assets
          cp publish/report.md assets/
          if [ -d publish/logs ] && [ -n "$(ls -A publish/logs 2>/dev/null)" ]; then
            zip -qr assets/rep_dr-logs.zip publish/logs publish/results publish/heuristics
          else
            zip -qr assets/rep_dr-logs.zip publish/results publish/heuristics
          fi
          ls -la assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "rep_dr-${{ github.run_id }}" \
            --title "rep_dr · run ${{ github.run_id }}" \
            --notes-file publish/report.md \
            assets/*
